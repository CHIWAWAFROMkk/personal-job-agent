name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Privacy audit
        run: python scripts/privacy_audit.py .
      - name: Tests
        run: python -m pytest -q
      - name: Fixed synthetic benchmark
        run: python evals/run_baseline.py
      - name: Frontend module and request checks
        run: node --experimental-vm-modules --test tests/test_frontend.mjs
