<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Agent 本地安全投递测试</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; background: #f3f6fa; margin: 0; color: #172033; }
    main { width: min(760px, calc(100% - 40px)); margin: 32px auto; background: white; padding: 28px; border-radius: 14px; box-shadow: 0 10px 30px #17203318; }
    h1 { margin-top: 0; font-size: 24px; }
    .hint { color: #5b6578; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    label, fieldset { display: grid; gap: 7px; font-weight: 600; }
    input, select, textarea, button { font: inherit; padding: 10px 12px; border: 1px solid #b8c1d1; border-radius: 8px; }
    textarea { min-height: 84px; resize: vertical; }
    fieldset { border: 1px solid #d5dbe5; border-radius: 8px; }
    fieldset label { display: inline-flex; margin-right: 16px; font-weight: 400; }
    .full { grid-column: 1 / -1; }
    button { margin-top: 22px; background: #2457d6; color: white; border: 0; cursor: pointer; }
    #status { margin-top: 12px; font-weight: 700; color: #9b2c2c; }
    .common-deliver { display: none; margin-top: 24px; padding: 18px; border: 2px solid #91a4c4; border-radius: 10px; }
    .user-resume { display: flex; justify-content: space-between; padding: 8px; margin: 8px 0; border: 1px solid #d5dbe5; }
    .right-item__img { width: 22px; height: 22px; border: 2px solid #91a4c4; border-radius: 50%; cursor: pointer; }
    .right-item__img.selected { background: #2457d6; }
    .complete-info__item { display: flex; gap: 12px; align-items: center; margin: 10px 0; }
    .el-select { position: relative; cursor: pointer; }
    .el-select-dropdown { display: none; position: relative; padding: 4px; border: 1px solid #b8c1d1; background: white; }
    .el-select-dropdown__item { padding: 4px 8px; cursor: pointer; }
    .common-deliver__footer .btn { margin-top: 16px; padding: 10px 12px; background: #2457d6; color: white; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>模拟招聘申请表</h1>
    <p class="hint">这个页面只用于验证：客观字段可填，主观字段留空，最终提交绝不触发。</p>
    <form id="application-form">
      <div class="grid">
        <label>姓名<input id="full-name" name="full_name" autocomplete="name" required></label>
        <label>邮箱<input id="email" name="email" type="email" autocomplete="email" required></label>
        <label>手机号<input id="phone" name="phone" type="tel" autocomplete="tel" required></label>
        <label>毕业院校<input id="school" name="school" required></label>
        <label>专业<input id="major" name="major" required></label>
        <label>学历
          <select id="degree" name="degree"><option value="">请选择</option><option>本科</option><option>硕士</option></select>
        </label>
        <label>毕业时间<input id="graduation" name="graduation_date" placeholder="YYYY-MM"></label>
        <label>上传定向简历<input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx"></label>
        <label>期望薪资<input id="salary" name="expected_salary"></label>
        <label>意向工作地点
          <select id="location" name="preferred_location"><option value="">请选择</option><option>上海</option><option>北京</option></select>
        </label>
        <fieldset class="full"><legend>是否接受调剂</legend><label><input type="radio" name="adjustment" value="yes">是</label><label><input type="radio" name="adjustment" value="no">否</label></fieldset>
        <label class="full">为什么选择我们<textarea id="why" name="why_company"></textarea></label>
      </div>
      <div id="application-entry" class="resume_apply com_res" tabindex="0">投个简历</div>
      <button id="submit-application" type="submit">最终提交申请</button>
      <div id="status" aria-live="polite">尚未提交</div>
    </form>
    <section class="common-deliver">
      <div class="common-deliver__header"><p>选择投递简历</p></div>
      <div class="user-resume">
        <div class="user-resume__left">My Resume</div>
        <div class="user-resume__right"><div class="right-item__img selected"></div></div>
      </div>
      <div class="user-resume">
        <div class="user-resume__left">附件简历</div>
        <div class="user-resume__right">
          <span>预览</span><span>修改</span><div class="right-item__img"></div>
          <input id="attachment-resume" type="file" accept=".pdf,.doc,.docx" hidden>
        </div>
      </div>
      <p>投递附件简历将一并投递您的在线简历，请及时更新在线简历</p>
      <div class="complete-info">
        <div class="complete-info__item">
          <span class="complete-info__item-title">到岗时间：</span>
          <div class="el-select" data-options="1周内|2周内|1个月内|3个月内"><input class="el-input__inner" value="2周内" readonly></div>
        </div>
        <div class="complete-info__item">
          <span class="complete-info__item-title">实习时长：</span>
          <div class="el-select" data-options="3个月以内|3-6个月|6个月以上"><input class="el-input__inner" value="3-6个月" readonly></div>
        </div>
        <div class="complete-info__item">
          <span class="complete-info__item-title">每周出勤：</span>
          <div class="el-select" data-options="1天|2天|3天|4天|5天|6天"><input class="el-input__inner" value="4天" readonly></div>
        </div>
      </div>
      <div class="common-deliver__footer"><div class="btn">确认投递</div></div>
    </section>
    <div id="option-host"></div>
  </main>
  <script>
    window.__jobAgentSubmitCount = 0;
    window.__jobAgentEntryClickCount = 0;
    window.__jobAgentFinalSubmitCount = 0;
    window.__jobAgentAttachmentName = '';
    document.querySelector('#application-entry').addEventListener('click', () => {
      window.__jobAgentEntryClickCount += 1;
      document.querySelector('.common-deliver').style.display = 'block';
    });
    document.querySelector('#application-form').addEventListener('submit', event => {
      event.preventDefault();
      window.__jobAgentSubmitCount += 1;
      document.querySelector('#status').textContent = `已触发提交 ${window.__jobAgentSubmitCount} 次`;
    });
    document.querySelector('#attachment-resume').addEventListener('change', event => {
      window.__jobAgentAttachmentName = event.target.files[0]?.name || '';
    });
    document.querySelectorAll('.right-item__img').forEach(control => {
      control.addEventListener('click', () => {
        document.querySelectorAll('.right-item__img').forEach(item => item.classList.remove('selected'));
        control.classList.add('selected');
      });
    });
    document.querySelectorAll('.el-select').forEach((select, selectIndex) => {
      select.addEventListener('click', () => {
        document.querySelectorAll('.el-select-dropdown').forEach(item => item.remove());
        const dropdown = document.createElement('div');
        dropdown.className = 'el-select-dropdown';
        dropdown.style.display = 'block';
        select.dataset.options.split('|').forEach(optionText => {
          const option = document.createElement('div');
          option.className = 'el-select-dropdown__item';
          option.textContent = optionText;
          option.addEventListener('click', event => {
            event.stopPropagation();
            select.querySelector('input').value = optionText;
            dropdown.remove();
          });
          dropdown.appendChild(option);
        });
        document.querySelector('#option-host').appendChild(dropdown);
      });
    });
    document.querySelector('.common-deliver__footer .btn').addEventListener('click', () => {
      window.__jobAgentFinalSubmitCount += 1;
      window.__jobAgentSubmitCount += 1;
    });
  </script>
</body>
</html>
